site_name: orlab
site_description: Script OpenRocket from Python — simulations, listeners, and flight data via JPype
site_url: https://heibench.com/orlab/
repo_url: https://github.com/heibench/orlab
repo_name: heibench/orlab

theme:
  name: material
  logo: https://heibench.com/assets/favicon.svg
  favicon: https://heibench.com/assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: true
            members_order: source

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Getting an OpenRocket jar: guides/jars.md
      - Simulation listeners: guides/listeners.md
      - Flight summaries: guides/summaries.md
      - Monte-carlo studies: guides/monte-carlo.md
      - Working across versions: guides/multi-version.md
      - Simulation setup: guides/simulation-setup.md
  - API reference: api.md
  - Maintainers: maintainers.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

extra_css:
  - https://heibench.com/assets/docs.css

extra:
  homepage: https://heibench.com/
  social:
    - icon: fontawesome/solid/house
      link: https://heibench.com/
      name: heibench
    - icon: fontawesome/brands/github
      link: https://github.com/heibench/orlab
      name: orlab on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/orlab/
      name: orlab on PyPI

copyright: Part of <a href="https://heibench.com/">heibench</a>. GPL-2.0-only.
