name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check (format, lint, types)
        run: just check

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.10 enforces the requires-python floor (mypy only checks the dev
        # interpreter). The windows cell is the only automated check of the
        # spawn/pickle/path/file-handling code on a platform the README
        # claims; the jar-free unit suite needs no JDK or compiler there.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.14"
            extras: true
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Run unit tests
        # bash on all platforms: pwsh would not fail the step on a mid-script
        # `uv sync` error
        shell: bash
        run: |
          uv sync
          uv run pytest -q

      - name: Tabular export against a real orlab[pandas] install
        # the extras-flagged cell installs the built package with the extra;
        # pandas stays out of every other environment on purpose. The flag
        # lives in the matrix so dropping the cell is visible, not a silent
        # skip-forever.
        if: matrix.extras
        shell: bash
        run: |
          uv venv extra-venv
          VIRTUAL_ENV="$PWD/extra-venv" uv pip install '.[pandas]' pytest
          extra-venv/bin/python -m pytest -q tests/test_tabular.py

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # tested tier: every profiled OpenRocket version on both supported JDKs
        or-version: ["15.03", "22.02", "23.09", "24.12"]
        java-version: ["17", "21"]
    env:
      ORLAB_TEST_VERSION: ${{ matrix.or-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Cache OpenRocket jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/orlab-jars
          # pin-file hash: a changed sha256 pin must not restore the stale jar
          # (cache entries are immutable per key)
          key: orlab-jars-${{ matrix.or-version }}-${{ hashFiles('src/orlab/_pins.py') }}

      - name: Run integration matrix
        run: |
          uv sync
          uv run pytest -q -m integration tests/integration
