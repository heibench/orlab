name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Exact version the dist must carry (e.g. 0.3.0) — guards against publishing the wrong ref"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Gate on checks and tests
        run: |
          uv sync --locked
          just check
          just test

      - name: Build sdist and wheel
        run: uv build

      - name: Guard built version against the intended release
        run: |
          set -eu
          version=$(ls dist/*.tar.gz | sed -E 's|.*/orlab-(.+)\.tar\.gz|\1|')
          echo "built: $version"
          case "${{ github.event_name }}" in
            release)
              want="${GITHUB_REF_NAME#v}" ;;
            workflow_dispatch)
              want="${{ inputs.expected_version }}" ;;
          esac
          if [ "$version" != "$want" ]; then
            echo "::error::built version '$version' does not match intended release '$want'"
            exit 1
          fi
          case "$version" in
            *.dev*|*rc*|*a[0-9]*|*b[0-9]*)
              echo "::error::refusing to publish pre-release version '$version' (build a release ref)"
              exit 1 ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
