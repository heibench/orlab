name: Audit

# Daily: audit every package pinned in uv.lock against OSV (`just audit`).
# Advisories arrive while nothing here changes, which is why this runs on a
# schedule rather than only on pull requests -- and why it is not part of the
# required `ok` gate, where an upstream advisory would turn every unrelated PR
# red. A scheduled or dispatched failure opens (or comments on) one tracked
# issue; a pull-request failure only reports on the PR.
#
# `uv audit` is experimental in uv 0.13: if its interface moves, this fails
# loudly and files the issue, which is the right outcome for a broken check.

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
      - justfile
      - .github/workflows/audit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Audit uv.lock
        run: just audit

  file-issue:
    runs-on: ubuntu-latest
    needs: audit
    if: failure() && github.event_name != 'pull_request'
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create audit --color B60205 \
            --description "uv.lock has a known vulnerability (scheduled uv audit)" --force
          open=$(gh issue list --label audit --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Still failing: $RUN_URL"
          else
            gh issue create --label audit \
              --title "audit: uv.lock has a known vulnerability" \
              --body "The scheduled \`just audit\` run failed: $RUN_URL -- relock the affected package (\`uv lock --upgrade-package <name>\`) or record why it cannot move."
          fi
